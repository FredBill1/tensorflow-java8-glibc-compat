name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: Build the JAR and execute the complete native compatibility matrix
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standard-library unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  native:
    if: github.event_name == 'workflow_dispatch' && inputs.native
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build the pinned Java 8 native build image
        run: docker build --platform linux/amd64 -f docker/native-build.Dockerfile -t tensorflow-java8-glibc-compat-build:java8-gcc10 .
      - name: Build and verify the compatibility artifact
        run: python scripts/build.py clean verify
      - name: Export independent SavedModel fixtures
        run: |
          python -m venv .venv-model
          .venv-model/bin/python -m pip install --require-hashes -r tests/model-requirements.lock
          .venv-model/bin/python tests/export_models.py
      - name: Execute Java 8 on both CPUs and both runtime baselines
        run: python tests/run_native_compat.py
      - name: Prepare local release files
        run: python scripts/release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-validation
          if-no-files-found: warn
          path: |
            dist/
            target/build.log
            target/surefire-reports/
            test-artifacts/native-compat/
